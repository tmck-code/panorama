// ===========================================================================
// Duck indicator marker
// Flips the `duckpressed` userinfo convar in lockstep with the duck key so the
// panorama speedometer can show an IMMEDIATE (key-press) duck glyph, instead of
// the delayed fully-ducked state from MomentumPlayerAPI.IsDucking().
//   - +duckind : press   -> +duck   + set marker 1
//   - -duckind : release -> -duck   + set marker 0
// Duck is bound to both "p" and "MOUSE4" (from config.cfg); rebind both.
// ===========================================================================

alias "+duckind" "+duck; setinfo duckpressed 1"
alias "-duckind" "-duck; setinfo duckpressed 0"

bind "p"      "+duckind"
bind "MOUSE4" "+duckind"

// Ensure the convar exists from the start (registers it for panorama to read).
setinfo duckpressed 0

// ===========================================================================
// Duck indicator style
// Picks which crouch-indicator variant the speedometer draws. Read live by
// panorama every speedometer tick, so changes apply instantly - no restart.
//   0 : pips    - three dots (stand / in-progress / fully ducked)
//   1 : bar     - silhouette bar shrinking 12px -> 5px as you crouch
//   2 : chevron - arrowhead rotating from pointing up to pointing down
//   3 : gauge   - vertical meter filling bottom-up as you crouch
// F7 cycles through them live for side-by-side comparison.
// ===========================================================================

setinfo duckstyle 1

alias duckstyle_next "incrementvar duckstyle 0 3 1"
bind "F7" "duckstyle_next"

echo "[duck-indicator] autoexec loaded - duck routed through +duckind, F7 cycles duckstyle"
