// ===========================================================================
// Duck indicator marker
// Flips the `duckpressed` userinfo convar in lockstep with the duck key so the
// panorama speedometer can show an IMMEDIATE (key-press) duck glyph, instead of
// the delayed fully-ducked state from MomentumPlayerAPI.IsDucking().
//   - +duckind : press   -> +duck   + set marker 1
//   - -duckind : release -> -duck   + set marker 0
// Duck is bound to both "p" and "MOUSE4" (from config.cfg); rebind both.
// ===========================================================================

alias "+duckind" "+duck; setinfo duckpressed 1"
alias "-duckind" "-duck; setinfo duckpressed 0"

bind "p"      "+duckind"
bind "MOUSE4" "+duckind"

// Ensure the convar exists from the start (registers it for panorama to read).
setinfo duckpressed 0

echo "[duck-indicator] autoexec loaded - duck routed through +duckind"

// ===========================================================================
// Auto-savestate death recovery (panorama: scripts/hud/fork-savestate-auto.ts)
// Panorama creates a savestate every 0.5s while the timer is running. After dying
// press Y (repeatable) to load the 4th-last one; savestates are deleted on new-run start.
//   - setinfo fork_ss_off 1 : opt-out switch read by panorama (default on); H toggles it
//   - the per-create "Savestate N created!" toast is suppressed by panorama
// ===========================================================================

// Y just raises a marker; panorama picks the 4th-last savestate (it needs the count).
alias "fork_ss_recover" "setinfo fork_ss_recover 1"

bind "y" "fork_ss_recover"

setinfo fork_ss_off 0
setinfo fork_ss_recover 0

// H toggles the feature; `alias` swapping is the cfg idiom for a stateful toggle.
alias "fork_ss_toggle_on"  "setinfo fork_ss_off 0; alias fork_ss_toggle fork_ss_toggle_off; echo [savestate-auto] ON"
alias "fork_ss_toggle_off" "setinfo fork_ss_off 1; alias fork_ss_toggle fork_ss_toggle_on;  echo [savestate-auto] OFF"
alias "fork_ss_toggle" "fork_ss_toggle_off"

bind "h" "fork_ss_toggle"

// Auto-savestates are throwaway; do not write them to savedlocs.txt between sessions.
mom_savestate_persist 0

echo "[savestate-auto] autoexec loaded - Y recovers to last auto-savestate"
